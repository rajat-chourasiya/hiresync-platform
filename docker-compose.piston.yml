services:
  api:
    image: ghcr.io/engineer-man/piston
    container_name: hiresync-piston
    restart: always
    privileged: true
    ports:
      - '2000:2000'
    volumes:
      - piston_data:/piston
    networks:
      - piston-net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1.0"

  runner:
    build:
      context: .
      dockerfile: apps/piston-runner/Dockerfile
    container_name: piston-runner
    restart: always
    ports:
      - '4000:4000'
    environment:
      - PISTON_INTERNAL_URL=http://api:2000
      - PISTON_MAX_MEMORY_MB=256
      - PISTON_RUN_TIMEOUT_MS=3000
      - PISTON_TIMEOUT_MS=10000
    depends_on:
      - api
    networks:
      - piston-net
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
    

volumes:
  piston_data:

networks:
  piston-net:
